```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture ideas before they disappear.</p>
    </header>

    <main>
        <section id="add-note-section">
            <h2>Add a note</h2>

            <form id="note-form">
                <label for="note-input">Your note</label>
                <input
                    type="text"
                    id="note-input"
                    placeholder="What do you need to remember?"
                    maxlength="200"
                    required
                >

                <label for="note-category">Choose a category</label>
                <select id="note-category" required>
                    <option value="personal">Personal</option>
                    <option value="work">Work</option>
                    <option value="study">Study</option>
                </select>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message" role="alert"></p>
        </section>

        <section id="your-notes-section">
            <h2>Your notes</h2>

            <label for="search-input">Search your notes</label>
            <input
                type="search"
                id="search-input"
                placeholder="Search notes..."
            >

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>QuickNotes — your ideas, organised.</p>
    </footer>
</body>
</html>
```
